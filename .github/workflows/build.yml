name: RSE Build Verification

on:
  push:
    branches: [main, 'release/1.0.21-alpha-rc1', 'feature/engineering-notebook-v1', 'codex/engineering-notebook-depth-v2']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Validate verifier syntax
        run: python3 -m compileall -q tools
      - name: Validation yard and plant contract tests
        run: python3 -m unittest tools.test_rse_validation_autorun tools.test_rse_validation_plant tools.test_rse_mega_factory tools.test_rse_live_diagnostics tools.test_rse_integrated_demo tools.test_rse_signal_processing_lab -v
      - name: Static and reference verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rse-audit
          : > .rse-audit/static-verification.log
          for verifier in \
            tools/rse_repo_verify.py \
            tools/rse_source_quality_audit.py \
            tools/rse_reference_model_tests.py \
            tools/rse_redstone_verify.py \
            tools/rse_full_audit.py \
            tools/rse_122_block_total_audit.py \
            tools/rse_122_block_closure_verify.py \
            tools/rse_neighbor_update_audit.py \
            tools/rse_interconnect_refactor_verify.py \
            tools/rse_alarm_topology_verify.py \
            tools/rse_event_intelligence_verify.py \
            tools/rse_plant_scope_persistence_verify.py \
            tools/rse_vanilla_redstone_engineering_verify.py \
            tools/rse_vanilla_redstone_runtime_verify.py \
            tools/rse_vanilla_redstone_timing_verify.py \
            tools/rse_vanilla_redstone_behavior_verify.py \
            tools/rse_vanilla_redstone_immutability_verify.py \
            tools/rse_alpha10_verify.py \
            tools/rse_alpha102_second_layer_verify.py \
            tools/rse_alpha103_pneumatic_hotfix_verify.py \
            tools/rse_alpha103_closed_loop_verify.py \
            tools/rse_alpha104_verify.py \
            tools/rse_alpha105_quality_verify.py \
            tools/rse_alpha106_engineering_verify.py \
            tools/rse_alpha107_legacy_wiring_verify.py \
            tools/rse_alpha108_dependency_verify.py \
            tools/rse_alpha109_required_dependencies_verify.py \
            tools/rse_alpha1010_port_architecture_verify.py \
            tools/rse_alpha1010_jade_hud_verify.py \
            tools/rse_alpha1011_legacy_gametest_verify.py \
            tools/rse_alpha1012_directional_io_verify.py \
            tools/rse_alpha1013_copper_topology_verify.py \
            tools/rse_alpha1014_metrology_verify.py \
            tools/rse_alpha1015_metrology_rollout_verify.py \
            tools/rse_alpha1016_commissioning_verify.py \
            tools/rse_alpha1017_engineering_ux_verify.py \
            tools/rse_alpha1018_acceptance_verify.py \
            tools/rse_alpha1019_acceptance_ux_verify.py \
            tools/rse_alpha1020_run_history_verify.py \
            tools/rse_alpha1020_release_verify.py \
            tools/rse_alpha1021_release_verify.py \
            tools/rse_visual_assets_verify.py \
            tools/rse_functional_correctness_verify.py \
            tools/rse_engineering_ui_verify.py \
            tools/rse_ui_dispatch_authority_verify.py \
            tools/rse_engineering_notebook_viewport_verify.py \
            tools/rse_quartz_timing_hmi_verify.py \
            tools/rse_amethyst_hmi_depth_verify.py \
            tools/rse_range_sensor_hmi_verify.py \
            tools/rse_optical_hmi_dispatch_verify.py \
            tools/rse_pneumatic_hmi_dispatch_verify.py \
            tools/rse_magnetic_hmi_dispatch_verify.py \
            tools/rse_advanced_quality_evidence_verify.py \
            tools/rse_process_hmi_quality_verify.py \
            tools/rse_universal_dual_endpoint_verify.py \
            tools/rse_physical_endpoint_routing_verify.py \
            tools/rse_diagnostics_console_verify.py \
            tools/rse_existing_visualization_verify.py \
            tools/rse_pid_telemetry_visualization_verify.py \
            tools/rse_operations_event_timeline_verify.py \
            tools/rse_operations_incident_drilldown_verify.py \
            tools/rse_electrical_protection_events_verify.py \
            tools/rse_electrical_reliability_verify.py \
            tools/rse_reliability_retention_contract_verify.py \
            tools/rse_communication_medium_identity_verify.py \
            tools/rse_signal_junction_topology_verify.py \
            tools/rse_first_ten_system_design_verify.py \
            tools/rse_second_ten_system_design_verify.py \
            tools/rse_third_ten_system_design_bug_verify.py \
            tools/rse_fourth_ten_system_design_bug_verify.py \
            tools/rse_fifth_ten_system_design_bug_verify.py \
            tools/rse_sixth_ten_system_design_bug_verify.py \
            tools/rse_seventh_ten_system_design_bug_verify.py \
            tools/rse_eighth_ten_conversion_communications_verify.py \
            tools/rse_ninth_ten_control_pneumatic_verify.py \
            tools/rse_tenth_ten_pneumatic_vibration_verify.py \
            tools/rse_eleventh_ten_media_evidence_verify.py \
            tools/rse_twelfth_ten_tail_runtime_verify.py \
            tools/rse_final_two_evidence_closure_verify.py \
            tools/rse_fourth_eight_verify.py \
            tools/rse_fifth_eight_verify.py \
            tools/rse_sixth_eight_verify.py \
            tools/rse_seventh_eight_verify.py \
            tools/rse_eighth_eight_verify.py \
            tools/rse_ninth_eight_verify.py \
            tools/rse_tenth_eight_verify.py \
            tools/rse_eleventh_eight_verify.py \
            tools/rse_twelfth_eight_verify.py \
            tools/rse_thirteenth_ten_verify.py \
            tools/rse_fourteenth_ten_verify.py \
            tools/rse_fifteenth_seven_verify.py \
            tools/rse_copper_hmi_verify.py \
            tools/rse_media_conversion_hmi_verify.py \
            tools/rse_field_tools_verify.py \
            tools/rse_instrument_measurement_validity_verify.py \
            tools/rse_signal_conditioner_hmi_verify.py \
            tools/rse_pulse_shaper_depth_verify.py \
            tools/rse_pid_actuator_dynamics_verify.py \
            tools/rse_pid_commissioning_hmi_verify.py \
            tools/rse_servo_actuator_depth_verify.py \
            tools/rse_single_relay_dynamics_verify.py \
            tools/rse_pwm_carrier_latch_verify.py \
            tools/rse_pneumatic_isolation_valve_dynamics_verify.py \
            tools/rse_pneumatic_check_valve_verify.py \
            tools/rse_pneumatic_relief_blowdown_verify.py \
            tools/rse_mechanical_exciter_dynamics_verify.py \
            tools/rse_precision_filter_depth_verify.py \
            tools/rse_engineering_light_sensor_depth_verify.py \
            tools/rse_tank_level_sensor_depth_verify.py \
            tools/rse_entity_density_sensor_depth_verify.py \
            tools/rse_copper_capacitor_depth_verify.py \
            tools/rse_copper_fuse_depth_verify.py \
            tools/rse_air_compressor_depth_verify.py \
            tools/rse_pneumatic_proportional_valve_depth_verify.py \
            tools/rse_pressure_regulator_depth_verify.py \
            tools/rse_pneumatic_receiver_depth_verify.py \
            tools/rse_magnetic_field_sensor_depth_verify.py \
            tools/rse_electromagnet_depth_verify.py \
            tools/rse_iron_core_depth_verify.py \
            tools/rse_redstone_core_depth_verify.py \
            tools/rse_foundation_domain_depth_verify.py \
            tools/rse_system_level_closure_phase1_verify.py \
            tools/rse_system_level_closure_phase2_verify.py
          do
            if [[ -f "$verifier" ]]; then
              echo "==> $verifier" | tee -a .rse-audit/static-verification.log
              python3 "$verifier" 2>&1 | tee -a .rse-audit/static-verification.log
            fi
          done
      - name: Upload 122-block audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rse-122-block-audit-${{ github.sha }}
          path: .rse-audit/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Compile Java and resolve required dependency platform
        run: ./gradlew compileJava --no-daemon --stacktrace --warning-mode all
      - name: Gradle tests
        run: ./gradlew test --no-daemon --stacktrace

      # GameTests are retained as explicit runtime evidence, but are no longer a normal PR/push gate.
      # They have historically been expensive and can fail independently of the static/compile/unit chain.
      # Run them deliberately from workflow_dispatch when runtime-topology evidence is wanted.
      - name: Minecraft topology GameTests (manual diagnostic)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .rse-audit
          timeout --signal=TERM 8m ./gradlew runGameTestServer --no-daemon --stacktrace 2>&1 | tee .rse-audit/gametest-server.log
          gametest_status=${PIPESTATUS[0]}
          if (( gametest_status == 124 )); then
            echo "::warning::GameTest server exceeded the 8-minute diagnostic window"
          elif (( gametest_status != 0 )); then
            echo "::warning::GameTest server exited non-zero: $gametest_status"
          elif grep -Fq "Too many chained neighbor updates" .rse-audit/gametest-server.log; then
            echo "::warning::GameTest server triggered the chained-neighbor-update safety cutoff"
          else
            summary_line="$(grep -E 'All [0-9]+ required tests passed :\)' .rse-audit/gametest-server.log | tail -n 1 || true)"
            if [[ -n "$summary_line" ]]; then
              echo "GameTest diagnostic evidence: $summary_line"
            else
              echo "::warning::GameTest diagnostic completed without an all-tests-passed summary"
            fi
          fi
          exit 0
      - name: Upload GameTest runtime log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rse-gametest-runtime-${{ github.sha }}
          path: .rse-audit/gametest-server.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Clean build
        run: ./gradlew clean build --no-daemon --stacktrace --warning-mode all
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rse-verified-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
