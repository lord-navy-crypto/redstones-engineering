name: RSE Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate verifier syntax
        run: python3 -m compileall -q tools

      - name: Static and reference verification
        shell: bash
        run: |
          set -euo pipefail
          for verifier in \
            tools/rse_repo_verify.py \
            tools/rse_source_quality_audit.py \
            tools/rse_reference_model_tests.py \
            tools/rse_redstone_verify.py \
            tools/rse_full_audit.py \
            tools/rse_122_block_total_audit.py \
            tools/rse_alpha10_verify.py \
            tools/rse_alpha102_second_layer_verify.py \
            tools/rse_alpha103_pneumatic_hotfix_verify.py \
            tools/rse_alpha103_closed_loop_verify.py \
            tools/rse_alpha104_verify.py \
            tools/rse_alpha105_quality_verify.py \
            tools/rse_alpha106_engineering_verify.py \
            tools/rse_alpha107_legacy_wiring_verify.py \
            tools/rse_alpha108_dependency_verify.py \
            tools/rse_alpha109_required_dependencies_verify.py \
            tools/rse_alpha1010_port_architecture_verify.py \
            tools/rse_alpha1010_jade_hud_verify.py \
            tools/rse_alpha1011_legacy_gametest_verify.py \
            tools/rse_alpha1012_directional_io_verify.py \
            tools/rse_alpha1013_copper_topology_verify.py \
            tools/rse_alpha1014_metrology_verify.py \
            tools/rse_alpha1015_metrology_rollout_verify.py \
            tools/rse_alpha1016_commissioning_verify.py \
            tools/rse_alpha1017_engineering_ux_verify.py \
            tools/rse_alpha1018_acceptance_verify.py \
            tools/rse_alpha1019_acceptance_ux_verify.py \
            tools/rse_alpha1020_run_history_verify.py \
            tools/rse_alpha1020_release_verify.py \
            tools/rse_visual_assets_verify.py \
            tools/rse_functional_correctness_verify.py \
            tools/rse_engineering_ui_verify.py \
            tools/rse_diagnostics_console_verify.py \
            tools/rse_fourth_eight_verify.py \
            tools/rse_fifth_eight_verify.py \
            tools/rse_sixth_eight_verify.py \
            tools/rse_seventh_eight_verify.py \
            tools/rse_eighth_eight_verify.py \
            tools/rse_ninth_eight_verify.py \
            tools/rse_tenth_eight_verify.py \
            tools/rse_eleventh_eight_verify.py \
            tools/rse_twelfth_eight_verify.py \
            tools/rse_thirteenth_ten_verify.py \
            tools/rse_fourteenth_ten_verify.py \
            tools/rse_fifteenth_seven_verify.py
          do
            if [[ -f "$verifier" ]]; then
              echo "==> $verifier"
              python3 "$verifier"
            fi
          done

      - name: Upload 122-block audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rse-122-block-audit-${{ github.sha }}
          path: .rse-audit/*
          if-no-files-found: warn
          retention-days: 14

      - name: Compile Java and resolve required dependency platform
        run: ./gradlew compileJava --no-daemon --stacktrace --warning-mode all

      - name: Gradle tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Minecraft topology GameTests
        run: ./gradlew runGameTestServer --no-daemon --stacktrace

      - name: Clean build
        run: ./gradlew clean build --no-daemon --stacktrace --warning-mode all

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rse-verified-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
