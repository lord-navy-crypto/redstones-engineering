name: RSE Operations Material Flow Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main/java/dev/redstoneengineering/operations/**'
      - 'src/main/java/dev/redstoneengineering/integration/**'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationBottleneckAssessment.java'
      - 'tools/rse_operations_material_release_verify.py'
      - 'tools/rse_operations_routing_verify.py'
      - 'tools/rse_operations_edd_verify.py'
      - 'tools/rse_operations_setup_verify.py'
      - 'tools/rse_operations_capacity_verify.py'
      - 'tools/rse_operations_quality_verify.py'
      - '.github/workflows/operations-material-flow.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/dev/redstoneengineering/operations/**'
      - 'src/main/java/dev/redstoneengineering/integration/**'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationBottleneckAssessment.java'
      - 'tools/rse_operations_material_release_verify.py'
      - 'tools/rse_operations_routing_verify.py'
      - 'tools/rse_operations_edd_verify.py'
      - 'tools/rse_operations_setup_verify.py'
      - 'tools/rse_operations_capacity_verify.py'
      - 'tools/rse_operations_quality_verify.py'
      - '.github/workflows/operations-material-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-material-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate verifier syntax
        run: python3 -m compileall -q tools
      - name: Verify downstream material release authority
        run: python3 tools/rse_operations_material_release_verify.py
      - name: Verify routing and precedence authority
        run: python3 tools/rse_operations_routing_verify.py
      - name: Verify earliest due date dispatch authority
        run: python3 tools/rse_operations_edd_verify.py
      - name: Verify setup and changeover authority
        run: python3 tools/rse_operations_setup_verify.py
      - name: Verify finite workcell capacity and bottleneck diagnostics
        run: python3 tools/rse_operations_capacity_verify.py
      - name: Verify quality disposition authority
        run: python3 tools/rse_operations_quality_verify.py
