name: RSE Operations Material Flow Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main/java/dev/redstoneengineering/operations/**'
      - 'src/main/java/dev/redstoneengineering/integration/**'
      - 'src/main/java/dev/redstoneengineering/entity/EngineeringMobileRobotEntity.java'
      - 'src/main/java/dev/redstoneengineering/validation/**'
      - 'src/main/java/dev/redstoneengineering/gametest/RseAmrWorldLogisticsPersistenceGameTests.java'
      - 'src/main/java/dev/redstoneengineering/gametest/RseValidationFactoryGameTests.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationBottleneckAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationReliabilityPerformanceAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationDueDateExposureAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationPlantViewAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationWorldPlantStateAssessment.java'
      - 'src/main/java/dev/redstoneengineering/block/IndustrialBufferBlock.java'
      - 'src/main/java/dev/redstoneengineering/ui/IndustrialBufferUi.java'
      - 'src/main/java/dev/redstoneengineering/ui/menu/IndustrialBufferMenu.java'
      - 'src/main/java/dev/redstoneengineering/client/ui/IndustrialBufferScreen.java'
      - 'src/main/java/dev/redstoneengineering/ui/menu/OperationsMonitorMenu.java'
      - 'src/main/java/dev/redstoneengineering/client/ui/OperationsMonitorScreen.java'
      - 'src/main/java/dev/redstoneengineering/item/OperationsBindingToolItem.java'
      - 'tools/rse_operations_material_release_verify.py'
      - 'tools/rse_operations_routing_verify.py'
      - 'tools/rse_operations_edd_verify.py'
      - 'tools/rse_operations_setup_verify.py'
      - 'tools/rse_operations_capacity_verify.py'
      - 'tools/rse_operations_quality_verify.py'
      - 'tools/rse_operations_maintenance_verify.py'
      - 'tools/rse_operations_reliability_verify.py'
      - 'tools/rse_operations_plant_view_verify.py'
      - 'tools/rse_operations_world_integration_verify.py'
      - 'tools/rse_operations_amr_world_verify.py'
      - 'tools/rse_validation_factory.py'
      - 'tools/rse_validation_presets.py'
      - 'tools/rse_validation_selftests.py'
      - 'tools/test_rse_validation_factory.py'
      - 'tools/test_rse_validation_autorun.py'
      - 'tools/rse_validation_factory_verify.py'
      - 'tools/rse_validation_selftest_verify.py'
      - 'tools/rse_industrial_buffer_world_verify.py'
      - 'tools/rse_operations_binding_tool_verify.py'
      - 'tools/rse_operations_monitor_world_plant_verify.py'
      - 'build.gradle'
      - '.github/workflows/operations-material-flow.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/dev/redstoneengineering/operations/**'
      - 'src/main/java/dev/redstoneengineering/integration/**'
      - 'src/main/java/dev/redstoneengineering/entity/EngineeringMobileRobotEntity.java'
      - 'src/main/java/dev/redstoneengineering/validation/**'
      - 'src/main/java/dev/redstoneengineering/gametest/RseAmrWorldLogisticsPersistenceGameTests.java'
      - 'src/main/java/dev/redstoneengineering/gametest/RseValidationFactoryGameTests.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationBottleneckAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationReliabilityPerformanceAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationDueDateExposureAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationPlantViewAssessment.java'
      - 'src/main/java/dev/redstoneengineering/diagnostics/OperationWorldPlantStateAssessment.java'
      - 'src/main/java/dev/redstoneengineering/block/IndustrialBufferBlock.java'
      - 'src/main/java/dev/redstoneengineering/ui/IndustrialBufferUi.java'
      - 'src/main/java/dev/redstoneengineering/ui/menu/IndustrialBufferMenu.java'
      - 'src/main/java/dev/redstoneengineering/client/ui/IndustrialBufferScreen.java'
      - 'src/main/java/dev/redstoneengineering/ui/menu/OperationsMonitorMenu.java'
      - 'src/main/java/dev/redstoneengineering/client/ui/OperationsMonitorScreen.java'
      - 'src/main/java/dev/redstoneengineering/item/OperationsBindingToolItem.java'
      - 'tools/rse_operations_material_release_verify.py'
      - 'tools/rse_operations_routing_verify.py'
      - 'tools/rse_operations_edd_verify.py'
      - 'tools/rse_operations_setup_verify.py'
      - 'tools/rse_operations_capacity_verify.py'
      - 'tools/rse_operations_quality_verify.py'
      - 'tools/rse_operations_maintenance_verify.py'
      - 'tools/rse_operations_reliability_verify.py'
      - 'tools/rse_operations_plant_view_verify.py'
      - 'tools/rse_operations_world_integration_verify.py'
      - 'tools/rse_operations_amr_world_verify.py'
      - 'tools/rse_validation_factory.py'
      - 'tools/rse_validation_presets.py'
      - 'tools/rse_validation_selftests.py'
      - 'tools/test_rse_validation_factory.py'
      - 'tools/test_rse_validation_autorun.py'
      - 'tools/rse_validation_factory_verify.py'
      - 'tools/rse_validation_selftest_verify.py'
      - 'tools/rse_industrial_buffer_world_verify.py'
      - 'tools/rse_operations_binding_tool_verify.py'
      - 'tools/rse_operations_monitor_world_plant_verify.py'
      - 'build.gradle'
      - '.github/workflows/operations-material-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-material-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate verifier syntax
        run: python3 -m compileall -q tools
      - name: Verify downstream material release authority
        run: python3 tools/rse_operations_material_release_verify.py
      - name: Verify routing and precedence authority
        run: python3 tools/rse_operations_routing_verify.py
      - name: Verify earliest due date dispatch authority
        run: python3 tools/rse_operations_edd_verify.py
      - name: Verify setup and changeover authority
        run: python3 tools/rse_operations_setup_verify.py
      - name: Verify finite workcell capacity and bottleneck diagnostics
        run: python3 tools/rse_operations_capacity_verify.py
      - name: Verify quality disposition authority
        run: python3 tools/rse_operations_quality_verify.py
      - name: Verify maintenance lifecycle and dispatch hold
        run: python3 tools/rse_operations_maintenance_verify.py
      - name: Verify observed reliability performance
        run: python3 tools/rse_operations_reliability_verify.py
      - name: Verify plant-level operations decision support
        run: python3 tools/rse_operations_plant_view_verify.py
      - name: Verify world-facing Operations resource adapters
        run: python3 tools/rse_operations_world_integration_verify.py
      - name: Verify AMR world logistics persistence
        run: python3 tools/rse_operations_amr_world_verify.py
      - name: Test Validation Factory asset tool
        run: python3 -m unittest tools.test_rse_validation_factory tools.test_rse_validation_autorun -v
      - name: Generate Validation Factory structures
        run: python3 tools/rse_validation_factory.py generate
      - name: Verify Validation Factory contract
        run: python3 tools/rse_validation_factory_verify.py
      - name: Verify self-checking validation runtime
        run: python3 tools/rse_validation_selftest_verify.py
      - name: Verify Industrial Buffer world block
        run: python3 tools/rse_industrial_buffer_world_verify.py
      - name: Verify Operations binding tool
        run: python3 tools/rse_operations_binding_tool_verify.py
      - name: Verify world-backed Operations Monitor plant state
        run: python3 tools/rse_operations_monitor_world_plant_verify.py
