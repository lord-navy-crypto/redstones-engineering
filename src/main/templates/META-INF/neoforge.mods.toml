modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lord-navy-crypto/redstones-engineering/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lord-navy-crypto/redstones-engineering"
authors="lord-navy-crypto"
description='''
Redstone Systems Engineering (RSE) extends vanilla Minecraft redstone into a
Minecraft-native engineering systems laboratory. It preserves the 0–15 redstone
boundary while adding instrumentation, signal conditioning, sampling, control,
diagnostics, data buses, radio links, pneumatics, mechatronics, operations
monitoring, and other engineering primitives.

Design path: measurement -> conditioning -> sampling -> control -> actuation -> optimization.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Required client engineering UX platform.
[[dependencies.${mod_id}]]
modId="jei"
type="required"
versionRange="[${jei_version},20)"
ordering="AFTER"
side="CLIENT"

# Required engineering HUD/data-provider platform.
[[dependencies.${mod_id}]]
modId="jade"
type="required"
versionRange="[${jade_version},16)"
ordering="AFTER"
side="BOTH"

# Required animation platform for articulated machines and actuators.
[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},5)"
ordering="AFTER"
side="BOTH"

# Required configuration-screen platform.
[[dependencies.${mod_id}]]
modId="cloth_config"
type="required"
versionRange="[${cloth_config_version},16)"
ordering="AFTER"
side="CLIENT"

# Required connected-texture/model platform for engineering visual topology.
[[dependencies.${mod_id}]]
modId="fusion"
type="required"
versionRange="[${fusion_version},2)"
ordering="AFTER"
side="CLIENT"
