modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lord-navy-crypto/redstones-engineering/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="rse_logo.png"
logoBlur=false
displayURL="https://github.com/lord-navy-crypto/redstones-engineering"
authors="lord-navy-crypto"
description='''
Redstone Systems Engineering (RSE) extends vanilla Minecraft redstone into a
Minecraft-native engineering systems laboratory while preserving the familiar
0-15 world-facing redstone signal boundary.

Required runtime platform dependencies:
- Jade ${jade_version} or newer compatible 15.x release
- GeckoLib ${geckolib_version} or newer compatible 4.x release
- LDLib2 ${ldlib2_version} or newer compatible 2.x release

Minecraft ${minecraft_version}
NeoForge ${neo_version} or newer compatible release

Only libraries with current direct API/resource usage are hard runtime requirements.
JEI, Cloth Config and Fusion are not required by the current implementation.

RSE is organized around an engineering workflow:
measurement -> conditioning -> sampling -> control -> actuation ->
optimization -> acceptance -> evidence -> comparison.

Core engineering modules include:
- Instrumentation and signal measurement
- Signal conditioning and analog processing
- Sampling, timing, and digital signal processing
- PID and closed-loop control
- Sensors, transducers, and calibration systems
- Electrical, optical, magnetic, thermal, and pneumatic systems
- Data buses, serial links, differential signaling, and radio communication
- Mechatronics, actuators, feedback, and machine-control components
- Diagnostics, commissioning, fault handling, and acceptance evidence
- Engineering UI, topology visualization, and operations monitoring
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Required engineering HUD/data-provider platform.
[[dependencies.${mod_id}]]
modId="jade"
type="required"
versionRange="[${jade_version},16)"
ordering="AFTER"
side="BOTH"

# Required animation platform for articulated machines and actuators.
[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},5)"
ordering="AFTER"
side="BOTH"


# Required modular engineering UI platform.
[[dependencies.${mod_id}]]
modId="ldlib2"
type="required"
versionRange="[${ldlib2_version},3)"
ordering="AFTER"
side="BOTH"
