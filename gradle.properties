# Sets default memory used for Gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
loader_version_range=[1,)

## Mod Properties
# Unique mod identifier. Must match the @Mod identifier in the main mod class.
mod_id=redstoneengineering
# Human-readable display name.
mod_name=Redstone Systems Engineering
# RSE is distributed under the MIT License; see the root LICENSE file.
mod_license=MIT
# Alpha 1.0.4: instrumentation modes, direction-aware measurement, and explicit feedback topology.
mod_version=1.0.4-alpha
# Maven/group namespace; matches the Java package root.
mod_group_id=dev.redstoneengineering
